name: Starred movies out today

# Every morning: a movie someone starred before it came out has opened -> push "go see it".
on:
  schedule:
    - cron: "0 7 * * *"   # 09:00-10:00 Israel time
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -X POST "https://emgtyfksnofzzlutngbf.supabase.co/functions/v1/cinema-push?action=released" || true
