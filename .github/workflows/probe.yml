name: probe
on:
  push:
    branches: [claude/project-thread-kx0hr8]
    paths: [probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python probe.py
      - run: |
          git config user.name "cinema-bot"; git config user.email "cinema-bot@users.noreply.github.com"
          git add docs/data.json && git commit -m "Refresh upcoming hits" && git push
