name: Weekly Cinema City scan

on:
  schedule:
    # Sunday 08:00 Israel time. Two slots cover summer (UTC+3) and winter (UTC+2);
    # scraper.py --scheduled runs only once per day, at/after 08:00 local.
    - cron: "0 5 * * 0"
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan movies and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Commit data
        run: |
          git config user.name "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Weekly movie scan $(date -u +%F)" && git push)
