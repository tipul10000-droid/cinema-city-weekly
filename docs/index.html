<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מה בסינמה סיטי השבוע</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סרטים">
<meta name="theme-color" content="#0f1115">
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#eceef2; --muted:#9aa1ad; --imdb:#f5c518; --good:#3fbf6f; --mid:#e0a43a; --bad:#e05a4f; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f6f4; --card:#fff; --line:#e4e4e0; --text:#16181d; --muted:#626873; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { touch-action:pan-y; overflow-x:hidden; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  header { padding:20px 16px 8px; max-width:900px; margin:auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .meta { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 16px; max-width:900px; margin:auto; position:sticky; top:0; background:var(--bg); z-index:2; border-bottom:1px solid var(--line); }
  .bar { flex-direction:column; align-items:stretch; gap:6px; position:static; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .bar input { flex:none !important; }
  .row .lbl2 { color:var(--muted); font-size:12px; flex:none; min-width:34px; }
  .row .chip { flex:none; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none; }
  .seg .chip { border:0; border-radius:0; }
  .mark { display:flex; gap:4px; }
  .mark button { background:none; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:16px; width:34px; height:30px; cursor:pointer; padding:0; }
  .mark button.on { color:var(--imdb); border-color:var(--imdb); }
  .mark button.seen.on { color:var(--good); border-color:var(--good); }
  .m.watched { opacity:.55; }
  .count { color:var(--muted); font-size:12px; margin:2px 0 8px; }
  .bar input { flex:1 1 160px; min-width:0; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  .chip { padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font:inherit; font-size:13px; }
  .chip.on { background:var(--text); color:var(--bg); }
  main { max-width:900px; margin:auto; padding:8px 16px 40px; }
  .m { display:grid; grid-template-columns:64px 1fr auto; gap:12px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; align-items:start; }
  .m img { width:64px; height:92px; object-fit:cover; border-radius:6px; background:var(--line); }
  .t { font-weight:650; font-size:16px; }
  .t a { color:inherit; text-decoration:none; }
  .he { color:var(--muted); font-size:13px; }
  .ppl { font-size:13px; margin-top:4px; }
  .ppl b { color:var(--muted); font-weight:500; }
  .tags { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:2px 7px; border-radius:6px; border:1px solid var(--line); color:var(--muted); }
  .tag.new { border-color:var(--good); color:var(--good); }
  .tag.old { border-color:var(--mid); color:var(--mid); }
  .tag.hall { border-color:var(--imdb); color:var(--text); }
  .scores { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .sc { display:inline-flex; gap:5px; align-items:center; font-weight:700; font-variant-numeric:tabular-nums; text-decoration:none; color:var(--text); font-size:15px; }
  .imdb .lbl { background:var(--imdb); color:#000; font-size:10px; font-weight:800; padding:1px 4px; border-radius:3px; }
  .na { color:var(--muted); font-weight:400; }
  .push { margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .push button { padding:8px 14px; border-radius:999px; border:0; background:var(--imdb); color:#000; font:inherit; font-weight:650; cursor:pointer; }
  .push button[disabled] { opacity:.6; cursor:default; }
  .tabs { display:flex; gap:6px; max-width:900px; margin:auto; padding:8px 16px 4px; }
  .tab { flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
  .tab.on { background:var(--imdb); color:#000; border-color:var(--imdb); }
  .month { margin:16px 0 8px; font-size:14px; color:var(--muted); font-weight:600; }
  .when { font-weight:700; font-size:14px; color:var(--good); white-space:nowrap; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>🎬 מה בסינמה סיטי השבוע</h1>
  <div class="meta" id="meta">טוען…</div>
  <div class="push" id="push" hidden><button id="pushBtn">🔔 הפעל התראות</button><span id="pushMsg"></span></div>
</header>
<nav class="tabs"><button class="tab on" data-tab="now">🎬 עכשיו בקולנוע</button><button class="tab" data-tab="soon">📅 בקרוב: הלהיטים</button></nav>
<section id="soonView" hidden><main><div class="count">הסרטים הגדולים שסינמה סיטי הכריזה עליהם לחודשיים הקרובים. תאריכים עשויים להשתנות.</div><div id="soonList"></div></main></section>
<div class="bar" id="nowBar">
  <input id="q" type="search" placeholder="חיפוש סרט, שחקן, במאי…">
  <div class="row"><span class="lbl2">מיון</span>
    <button class="chip" data-sort="imdb">IMDb</button>
    <button class="chip" data-sort="rt">🍅 Rotten Tomatoes</button>
    <button class="chip" data-sort="new">חדשים קודם</button>
    <button class="chip" data-sort="title">שם</button>
  </div>
  <div class="row"><span class="lbl2">סינון</span>
    <span class="seg"><button class="chip" data-aud="all">הכל</button><button class="chip" data-aud="adults">מבוגרים</button><button class="chip" data-aud="kids">ילדים</button></span>
    <button class="chip" data-f="noDub">בלי מדובבים</button>
    <button class="chip" data-f="noForeign">בלי שפות זרות</button>
    <button class="chip" data-f="stars">⭐ שמות גדולים</button>
    <button class="chip" data-f="fav">★ מועדפים</button>
    <button class="chip" data-f="hideSeen">הסתר שראיתי</button>
    <button class="chip" data-f="special">אולמות מיוחדים</button>
    <button class="chip" data-f="leaving">⏳ לפני ירידה</button>
    <button class="chip" data-f="premieres">🆕 בכורות השבוע</button>
  </div>
</div>
<main id="nowView"><div class="count" id="count"></div><div id="list"></div></main>
<script>
let data = [];
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const st = Object.assign({ sort: "imdb", aud: "all", noDub: false, noForeign: false, stars: false, fav: false, hideSeen: false, special: false, leaving: false, premieres: false }, load("cc-filters", {}));
let prefs = load("cc-prefs", { fav: [], seen: [] });  // English titles; synced with the server so phone and desktop match
const LANG = { fr: "צרפתית", es: "ספרדית", it: "איטלקית", de: "גרמנית", ja: "יפנית", ko: "קוריאנית", hi: "הינדית", ru: "רוסית", zh: "סינית", ar: "ערבית", tr: "טורקית", pt: "פורטוגזית", sv: "שוודית", da: "דנית", pl: "פולנית" };
const isKids = m => m.kids ?? /KID/.test(m.genre || "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY = 864e5;
const fmtDate = d => `${d.getDate()}.${d.getMonth() + 1}`;
// premiered in the 7 days before the scan (usually Thursday), or opens during the scanned week
let scanDate = new Date();
function isPremiere(m) {
  if (m.premiere_week != null) return m.premiere_week;
  if (!m.date_started) return false;
  const days = Math.floor((scanDate - new Date(m.date_started + "T00:00:00")) / DAY);
  return days >= -6 && days <= 7;
}
function isLeaving(m, weeks) {
  if (m.leaving != null) return m.leaving;
  if (weeks == null) { if (!m.date_started) return false; weeks = Math.floor((Date.now() - new Date(m.date_started + "T00:00:00")) / DAY / 7) + 1; }
  return m.screenings != null ? (weeks >= 4 && m.screenings <= 15) || weeks >= 9 : weeks >= 8;
}
// how long it has been in Israeli cinemas, from Cinema City's premiere date
function runTag(m) {
  if (!m.date_started) return "";
  const start = new Date(m.date_started + "T00:00:00"), days = Math.floor((Date.now() - start) / DAY);
  if (days < 0) return `<span class="tag new">🆕 בכורה ב-${fmtDate(start)}</span>`;
  if (days < 8) return `<span class="tag new">🆕 חדש, עלה ב-${fmtDate(start)}</span>`;
  const weeks = Math.floor(days / 7) + 1;
  // few screenings after a month in cinemas (or two months in, regardless) = probably leaving soon
  const leaving = isLeaving(m, weeks);
  if (leaving) return `<span class="tag old">⏳ שבוע ${weeks}, ${m.screenings} הקרנות השבוע${m.prev_screenings ? ` (היו ${m.prev_screenings})` : ""}, כנראה לקראת ירידה</span>`;
  return `<span class="tag">שבוע ${weeks} בקולנוע</span>`;
}
// non-standard halls, with where they are
const HALLS = {
  "Lounge": ["🛋️", "Lounge"], "VIP": ["🥂", "VIP"], "Prime": ["💺", "Prime"],
  "ONYX": ["🖥️", "ONYX"], "Infinity Vision": ["🎞️", "Infinity Vision"],
};
const HALL_INFO = {
  "Lounge": "אולם פרימיום עם כורסאות מתכווננות ושירות",
  "VIP": "אולם VIP עם כורסאות מפנקות",
  "Prime": "מושבים מרווחים ומשודרגים",
  "ONYX": "מסך LED של Samsung Onyx במקום מקרן",
  "Infinity Vision": "אולם מסך ענק",
};
const hallTags = m => Object.entries(m.halls || {}).map(([h, locs]) =>
  `<span class="tag hall" title="${esc(HALL_INFO[h] || "")}">${HALLS[h]?.[0] || "✨"} ${esc(HALLS[h]?.[1] || h)}: ${esc(locs.join(", "))}</span>`).join("");
const VERSION_LABEL = { "מדובב": "יש גם מדובב", "אנגלית": "יש גם באנגלית" };
const sorters = {
  imdb: (a, b) => (b.imdb ?? -1) - (a.imdb ?? -1) || (b.rt ?? -1) - (a.rt ?? -1),
  rt: (a, b) => (b.rt ?? -1) - (a.rt ?? -1) || (b.imdb ?? -1) - (a.imdb ?? -1),
  title: (a, b) => a.title.localeCompare(b.title),
  new: (a, b) => (b.date_started || "").localeCompare(a.date_started || "") || (b.imdb ?? -1) - (a.imdb ?? -1),
};
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = data.filter(m => {
    if (st.aud === "kids" && !isKids(m)) return false;
    if (st.aud === "adults" && isKids(m)) return false;
    if (st.noDub && m.has_original === false) return false;
    if (st.noForeign && m.foreign) return false;
    if (st.stars && !(m.top_people || []).length) return false;
    if (st.fav && !prefs.fav.includes(m.title)) return false;
    if (st.hideSeen && prefs.seen.includes(m.title)) return false;
    if (st.special && !Object.keys(m.halls || {}).length) return false;
    if (st.leaving && !isLeaving(m)) return false;
    if (st.premieres && !isPremiere(m)) return false;
    if (!q) return true;
    return [m.title, m.title_he, ...(m.actors||[]), ...(m.directors||[]), m.genre].join(" ").toLowerCase().includes(q);
  }).sort(sorters[st.sort]);
  document.getElementById("count").textContent = rows.length === data.length ? "" : `מוצגים ${rows.length} מתוך ${data.length}`;
  document.getElementById("list").innerHTML = rows.length ? rows.map(m => `
    <article class="m${prefs.seen.includes(m.title) ? " watched" : ""}">
      <a href="${esc(m.cc_url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(m.poster)}" alt=""></a>
      <div>
        <div class="t" dir="ltr" style="text-align:right"><a href="${esc(m.cc_url)}" target="_blank" rel="noopener">${esc(m.title)}</a>${m.year ? ` <span class="he">(${m.year})</span>` : ""}</div>
        ${m.title_he && m.title_he !== m.title ? `<div class="he">${esc(m.title_he)}</div>` : ""}
        ${m.directors?.length ? `<div class="ppl"><b>במאי:</b> <span dir="ltr">${people(m, m.directors)}</span></div>` : ""}
        ${m.actors?.length ? `<div class="ppl"><b>שחקנים:</b> <span dir="ltr">${people(m, m.actors)}</span></div>` : ""}
        <div class="tags">
          ${m.genre ? `<span class="tag">${esc(m.genre)}</span>` : ""}
          ${m.duration ? `<span class="tag">${m.duration} דק׳</span>` : ""}
          ${m.foreign ? `<span class="tag">🌍 ${esc(LANG[m.language] || m.language)}</span>` : ""}
          ${runTag(m)}
          ${hallTags(m)}
          ${m.has_original !== false ? m.versions.map(v => `<span class="tag">${esc(VERSION_LABEL[v] || v)}</span>`).join("") : `<span class="tag">מדובב בלבד</span>`}
        </div>
      </div>
      <div class="scores">
        <a class="sc imdb" href="${esc(m.imdb_url || "#")}" target="_blank" rel="noopener"><span class="lbl">IMDb</span>${m.imdb ? m.imdb.toFixed(1) : '<span class="na">–</span>'}</a>
        <a class="sc rt" href="${esc(m.rt_url || "#")}" target="_blank" rel="noopener">🍅 ${m.rt != null ? m.rt + "%" : '<span class="na">–</span>'}</a>
        <div class="mark">
          <button class="${prefs.fav.includes(m.title) ? "on" : ""}" data-mark="fav" data-t="${esc(m.title)}" title="מועדף">${prefs.fav.includes(m.title) ? "★" : "☆"}</button>
          <button class="seen ${prefs.seen.includes(m.title) ? "on" : ""}" data-mark="seen" data-t="${esc(m.title)}" title="ראיתי">✓</button>
        </div>
      </div>
    </article>`).join("") : `<div class="empty">אין תוצאות</div>`;
}
// big names are bold
const people = (m, list) => list.map(p => (m.top_people || []).includes(p) ? `<strong>${esc(p)}</strong>` : esc(p)).join(", ");
// upcoming blockbusters, grouped by month
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
let soon = [];
function renderSoon() {
  const rows = soon.filter(m => new Date(m.date_started + "T23:59:59") >= Date.now()).sort((a, b) => a.date_started.localeCompare(b.date_started));
  let month = "";
  document.getElementById("soonList").innerHTML = rows.length ? rows.map(m => {
    const d = new Date(m.date_started + "T00:00:00"), days = Math.ceil((d - Date.now()) / DAY);
    const head = MONTHS[d.getMonth()] !== month ? `<div class="month">${month = MONTHS[d.getMonth()]}</div>` : "";
    return `${head}
    <article class="m">
      <a href="${esc(m.cc_url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(m.poster)}" alt=""></a>
      <div>
        <div class="t" dir="ltr" style="text-align:right"><a href="${esc(m.cc_url)}" target="_blank" rel="noopener">${esc(m.title)}</a></div>
        ${m.title_he && m.title_he !== m.title ? `<div class="he">${esc(m.title_he)}</div>` : ""}
        ${m.directors?.length ? `<div class="ppl"><b>במאי:</b> <span dir="ltr">${people(m, m.directors)}</span></div>` : ""}
        ${m.actors?.length ? `<div class="ppl"><b>שחקנים:</b> <span dir="ltr">${people(m, m.actors)}</span></div>` : ""}
        <div class="tags">
          ${m.genre ? `<span class="tag">${esc(m.genre)}</span>` : ""}
          ${m.popularity ? `<span class="tag hall" title="דירוג הפופולריות ב-IMDb">🔥 #${m.popularity} ב-IMDb</span>` : ""}
          ${m.kids ? `<span class="tag">👨‍👧 ילדים</span>` : ""}
          ${m.dubbed_only ? `<span class="tag">מדובב בלבד</span>` : ""}
        </div>
      </div>
      <div class="scores">
        <span class="when">${fmtDate(d)}</span>
        <span class="he">${days <= 0 ? "היום" : days === 1 ? "מחר" : `בעוד ${days} ימים`}</span>
        <div class="mark"><button class="${prefs.fav.includes(m.title) ? "on" : ""}" data-mark="fav" data-t="${esc(m.title)}" title="מועדף">${prefs.fav.includes(m.title) ? "★" : "☆"}</button></div>
      </div>
    </article>`;
  }).join("") : `<div class="empty">אין כרגע להיטים גדולים מוכרזים לחודשיים הקרובים</div>`;
}
let tab = load("cc-tab", "now");
function showTab() {
  document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  document.getElementById("soonView").hidden = tab !== "soon";
  document.getElementById("nowView").hidden = document.getElementById("nowBar").hidden = tab !== "now";
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; save("cc-tab", tab); showTab(); scrollTo(0, 0); });
showTab();
function syncChips() {
  document.querySelectorAll("[data-sort]").forEach(x => x.classList.toggle("on", x.dataset.sort === st.sort));
  document.querySelectorAll("[data-aud]").forEach(x => x.classList.toggle("on", x.dataset.aud === st.aud));
  document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", !!st[x.dataset.f]));
}
const changed = () => { save("cc-filters", st); syncChips(); render(); };
document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { st.sort = b.dataset.sort; changed(); });
document.querySelectorAll("[data-aud]").forEach(b => b.onclick = () => { st.aud = b.dataset.aud; changed(); });
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { st[b.dataset.f] = !st[b.dataset.f]; changed(); });
syncChips();
document.getElementById("soonList").onclick = document.getElementById("list").onclick = e => {
  const b = e.target.closest("[data-mark]");
  if (!b) return;
  const list = prefs[b.dataset.mark], t = b.dataset.t, i = list.indexOf(t);
  i < 0 ? list.push(t) : list.splice(i, 1);
  save("cc-prefs", prefs); save("cc-prefs-dirty", true); render(); renderSoon(); pushPrefs();
};
// favorites and watched live on the server too, so the phone and the desktop see the same marks
// and the weekly scan can warn when a favorite is about to leave
const PREFS_API = "https://emgtyfksnofzzlutngbf.supabase.co/functions/v1/cinema-push";
let prefsTimer;
function pushPrefs() {
  clearTimeout(prefsTimer);
  prefsTimer = setTimeout(sendPrefs, 300);
}
const sendPrefs = () => fetch(PREFS_API + "?action=prefs", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify(prefs) })
  .then(r => { if (r.ok) save("cc-prefs-dirty", false); }).catch(() => {});
addEventListener("pagehide", () => { if (load("cc-prefs-dirty", false)) sendPrefs(); });
fetch(PREFS_API + "?action=prefs").then(r => r.ok ? r.json() : null).then(p => {
  if (!p?.prefs) return;
  if (load("cc-prefs-dirty", false)) { sendPrefs(); return; }  // this device has marks the server hasn't seen yet
  const server = p.prefs, local = load("cc-prefs-synced", false);
  // first visit on this device: merge in anything marked locally before sync existed
  prefs = local ? server : { fav: [...new Set([...server.fav, ...prefs.fav])], seen: [...new Set([...server.seen, ...prefs.seen])] };
  save("cc-prefs", prefs); save("cc-prefs-synced", true);
  if (!local && (prefs.fav.length > server.fav.length || prefs.seen.length > server.seen.length)) pushPrefs();
  render(); renderSoon();
}).catch(() => {});
document.getElementById("q").oninput = render;
// no zoom: block pinch (iOS gesture events) and double-tap
document.addEventListener("gesturestart", e => e.preventDefault());
let lastTap = 0;
document.addEventListener("touchend", e => { const t = Date.now(); if (t - lastTap < 300) e.preventDefault(); lastTap = t; }, { passive: false });
// ---- web push ----
const PUSH_API = "https://emgtyfksnofzzlutngbf.supabase.co/functions/v1/cinema-push";
const b64ToBytes = s => Uint8Array.from(atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
(async () => {
  const box = document.getElementById("push"), btn = document.getElementById("pushBtn"), msg = document.getElementById("pushMsg");
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (!("serviceWorker" in navigator)) return;
  const reg = await navigator.serviceWorker.register("sw.js");
  box.hidden = false;
  if (!("PushManager" in window)) {
    btn.hidden = true;
    msg.textContent = ios && !standalone ? "להתראות: שתף ← הוסף למסך הבית, ופתח משם" : "הדפדפן הזה לא תומך בהתראות";
    return;
  }
  const existing = await reg.pushManager.getSubscription();
  const done = () => { btn.disabled = true; btn.textContent = "🔔 התראות פעילות"; msg.textContent = "כל יום ראשון ב-08:00"; };
  if (existing && Notification.permission === "granted") done();
  btn.onclick = async () => {
    btn.disabled = true; msg.textContent = "מפעיל…";
    try {
      if (await Notification.requestPermission() !== "granted") throw new Error("לא ניתן אישור להתראות");
      const { publicKey } = await (await fetch(PUSH_API + "?action=pubkey")).json();
      const sub = existing || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
      const r = await fetch(PUSH_API + "?action=subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
      if (!r.ok) throw new Error("השמירה נכשלה");
      done();
    } catch (e) { btn.disabled = false; msg.textContent = e.message; }
  };
})();

fetch("data.json?" + Date.now()).then(r => r.json()).then(d => {
  data = d.movies;
  soon = d.upcoming || [];
  if (soon.length) document.querySelector("[data-tab=soon]").textContent = `📅 בקרוב: הלהיטים (${soon.length})`;
  renderSoon();
  scanDate = new Date(d.generated_at.slice(0, 10) + "T12:00:00");
  const np = data.filter(isPremiere).length;
  if (np) document.querySelector('[data-f=premieres]').textContent = `🆕 בכורות השבוע (${np})`;
  const dt = new Date(d.generated_at);
  document.getElementById("meta").textContent = `${data.length} סרטים מוקרנים · עודכן ${dt.toLocaleString("he-IL", {weekday:"long", day:"numeric", month:"numeric", hour:"2-digit", minute:"2-digit"})}`;
  render();
}).catch(() => document.getElementById("meta").textContent = "עדיין אין נתונים. הסריקה הראשונה תרוץ בקרוב.");
</script>
